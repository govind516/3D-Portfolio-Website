<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Meeting-to-Action Copilot project visual</title>
  <desc id="desc">AI-powered meeting transcript processing with Spring Boot API and action items extraction.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop stop-color="#b8ff5c"/>
      <stop offset=".55" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#7aa2ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="panel2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b8ff5c" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7aa2ff" stop-opacity=".07"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" rx="44" fill="#080a10"/>
  <path d="M0 0h960v600H0z" fill="url(#g)" opacity=".05"/>
  <circle cx="120" cy="80" r="200" fill="#b8ff5c" opacity=".04"/>
  <circle cx="840" cy="520" r="220" fill="#7aa2ff" opacity=".04"/>
  <g stroke="#fff" stroke-opacity=".06">
    <path d="M48 140h864M48 280h864M48 420h864"/>
    <path d="M240 48v504M480 48v504M720 48v504"/>
  </g>

  <!-- Panel 1: Meeting Transcript -->
  <g filter="url(#shadow)">
    <rect x="48" y="92" width="280" height="420" rx="20" fill="url(#panel)" stroke="#fff" stroke-opacity=".12" stroke-width="1.5"/>
    <rect x="48" y="92" width="280" height="52" rx="20" fill="#fff" fill-opacity=".06"/>
    <circle cx="80" cy="118" r="14" fill="#ff6b3d"/>
    <circle cx="112" cy="118" r="14" fill="#4fd1c5"/>
    <circle cx="144" cy="118" r="14" fill="#b8ff5c"/>
    <text x="176" y="125" fill="#f6f3eb" font-family="Arial" font-size="16" font-weight="700">live transcript</text>
    <!-- Chat bubbles -->
    <rect x="76" y="168" width="200" height="64" rx="12" fill="#f6f3eb" fill-opacity=".1"/>
    <text x="90" y="194" fill="#f6f3eb" font-family="Arial" font-size="13" font-weight="600">Alice: Let's finalize the API</text>
    <text x="90" y="214" fill="#f6f3eb" font-family="Arial" font-size="13" font-weight="400">response schema for /tasks</text>
    <rect x="76" y="248" width="210" height="64" rx="12" fill="#f6f3eb" fill-opacity=".08"/>
    <text x="90" y="274" fill="#f6f3eb" font-family="Arial" font-size="13" font-weight="600">Bob: Need to add retry logic</text>
    <text x="90" y="294" fill="#f6f3eb" font-family="Arial" font-size="13" font-weight="400">for Kafka consumers</text>
    <rect x="76" y="328" width="194" height="80" rx="12" fill="url(#panel2)" stroke="#b8ff5c" stroke-opacity=".35"/>
    <text x="90" y="354" fill="#b8ff5c" font-family="Arial" font-size="13" font-weight="700">SUMMARY DETECTED</text>
    <text x="90" y="376" fill="#f6f3eb" font-family="Arial" font-size="13" font-weight="400">"Create action items and</text>
    <text x="90" y="394" fill="#f6f3eb" font-family="Arial" font-size="13" font-weight="400">assign owners"`
    <circle cx="258" cy="172" r="5" fill="#b8ff5c" filter="url(#glow)"/>
    <circle cx="258" cy="252" r="5" fill="#4fd1c5"/>
  </g>

  <!-- Connector -->
  <path d="M328 300h48M376 300l-16-12M376 300l-16 12" stroke="url(#g)" stroke-width="3" fill="none"/>
  <circle cx="352" cy="300" r="4" fill="#b8ff5c" filter="url(#glow)"/>

  <!-- Panel 2: Spring API -->
  <g filter="url(#shadow)">
    <rect x="376" y="140" width="220" height="280" rx="20" fill="url(#panel)" stroke="#fff" stroke-opacity=".12" stroke-width="1.5"/>
    <rect x="376" y="140" width="220" height="48" rx="20" fill="#b8ff5c" fill-opacity=".14"/>
    <text x="400" y="170" fill="#b8ff5c" font-family="Arial" font-size="14" font-weight="800">SPRING BOOT API</text>
    <!-- API rows -->
    <g>
      <rect x="396" y="208" width="180" height="38" rx="8" fill="#f6f3eb" fill-opacity=".07"/>
      <rect x="404" y="219" width="44" height="16" rx="4" fill="#b8ff5c" fill-opacity=".2"/>
      <text x="408" y="231" fill="#b8ff5c" font-family="monospace" font-size="10" font-weight="700">POST</text>
      <text x="456" y="231" fill="#f6f3eb" font-family="monospace" font-size="11">/process</text>
      <circle cx="560" cy="227" r="5" fill="#b8ff5c"/>
    </g>
    <g>
      <rect x="396" y="256" width="180" height="38" rx="8" fill="#f6f3eb" fill-opacity=".07"/>
      <rect x="404" y="267" width="38" height="16" rx="4" fill="#7aa2ff" fill-opacity=".25"/>
      <text x="408" y="279" fill="#7aa2ff" font-family="monospace" font-size="10" font-weight="700">GET</text>
      <text x="450" y="279" fill="#f6f3eb" font-family="monospace" font-size="11">/actions</text>
      <circle cx="560" cy="275" r="5" fill="#7aa2ff"/>
    </g>
    <g>
      <rect x="396" y="304" width="180" height="38" rx="8" fill="#f6f3eb" fill-opacity=".07"/>
      <rect x="404" y="315" width="44" height="16" rx="4" fill="#ff6b3d" fill-opacity=".25"/>
      <text x="408" y="327" fill="#ff6b3d" font-family="monospace" font-size="10" font-weight="700">PUT</text>
      <text x="456" y="327" fill="#f6f3eb" font-family="monospace" font-size="11">/action/:id</text>
      <circle cx="560" cy="323" r="5" fill="#ff6b3d"/>
    </g>
    <!-- Docker badge -->
    <rect x="396" y="360" width="82" height="26" rx="13" fill="#fff" fill-opacity=".08"/>
    <path d="M404 373h40" stroke="#4fd1c5" stroke-width="2.5" stroke-linecap="round"/>
    <text x="410" y="379" fill="#4fd1c5" font-family="Arial" font-size="10" font-weight="700">DOCKER</text>
    <!-- SonarQube badge -->
    <rect x="488" y="360" width="88" height="26" rx="13" fill="#fff" fill-opacity=".08"/>
    <path d="M498 373h40" stroke="#7aa2ff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="504" y="379" fill="#7aa2ff" font-family="Arial" font-size="10" font-weight="700">SONAR</text>
  </g>

  <!-- Connector -->
  <path d="M596 300h48M644 300l-16-12M644 300l-16 12" stroke="url(#g)" stroke-width="3" fill="none"/>
  <circle cx="620" cy="300" r="4" fill="#4fd1c5" filter="url(#glow)"/>

  <!-- Panel 3: Action Items -->
  <g filter="url(#shadow)">
    <rect x="644" y="92" width="268" height="420" rx="20" fill="url(#panel)" stroke="#fff" stroke-opacity=".12" stroke-width="1.5"/>
    <rect x="644" y="92" width="268" height="52" rx="20" fill="#4fd1c5" fill-opacity=".12"/>
    <text x="672" y="125" fill="#4fd1c5" font-family="Arial" font-size="16" font-weight="800">ACTION ITEMS</text>
    <!-- Action item 1 -->
    <rect x="668" y="164" width="220" height="62" rx="10" fill="#f6f3eb" fill-opacity=".07"/>
    <rect x="684" y="178" width="20" height="20" rx="5" fill="none" stroke="#b8ff5c" stroke-width="2"/>
    <path d="M688 188l5 5 8-9" fill="none" stroke="#b8ff5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="716" y="190" fill="#f6f3eb" font-family="Arial" font-size="13" font-weight="600">Finalize /tasks schema</text>
    <text x="716" y="210" fill="#a9aaa7" font-family="Arial" font-size="11">Owner: Alice * Due: Fri</text>
    <rect x="846" y="180" width="28" height="18" rx="9" fill="#b8ff5c" fill-opacity=".2"/>
    <text x="850" y="193" fill="#b8ff5c" font-family="Arial" font-size="9" font-weight="700">NEW</text>
    <!-- Action item 2 -->
    <rect x="668" y="240" width="220" height="62" rx="10" fill="#f6f3eb" fill-opacity=".07"/>
    <rect x="684" y="254" width="20" height="20" rx="5" fill="none" stroke="#7aa2ff" stroke-width="2"/>
    <path d="M688 264l5 5 8-9" fill="none" stroke="#7aa2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="716" y="266" fill="#f6f3eb" font-family="Arial" font-size="13" font-weight="600">Add Kafka retry logic</text>
    <text x="716" y="286" fill="#a9aaa7" font-family="Arial" font-size="11">Owner: Bob * Due: Mon</text>
    <rect x="846" y="256" width="28" height="18" rx="9" fill="#7aa2ff" fill-opacity=".2"/>
    <text x="850" y="269" fill="#7aa2ff" font-family="Arial" font-size="9" font-weight="700">NEW</text>
    <!-- Action item 3 (completed) -->
    <rect x="668" y="316" width="220" height="62" rx="10" fill="#f6f3eb" fill-opacity=".05"/>
    <rect x="684" y="330" width="20" height="20" rx="5" fill="#4fd1c5" fill-opacity=".25"/>
    <path d="M688 340l5 5 8-9" fill="none" stroke="#4fd1c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="716" y="342" fill="#a9aaa7" font-family="Arial" font-size="13" font-weight="600" text-decoration="line-through">Set up SonarQube</text>
    <text x="716" y="362" fill="#a9aaa7" font-family="Arial" font-size="11">Owner: Dev * Done: Today</text>
    <rect x="846" y="332" width="28" height="18" rx="9" fill="#4fd1c5" fill-opacity=".15"/>
    <text x="850" y="345" fill="#4fd1c5" font-family="Arial" font-size="9" font-weight="700">DONE</text>
    <!-- Progress bar -->
    <rect x="668" y="410" width="220" height="6" rx="3" fill="#f6f3eb" fill-opacity=".1"/>
    <rect x="668" y="410" width="148" height="6" rx="3" fill="url(#g)"/>
    <text x="668" y="448" fill="#a9aaa7" font-family="Arial" font-size="12">Progress</text>
    <text x="868" y="448" fill="#b8ff5c" font-family="Arial" font-size="12" font-weight="700">67%</text>
  </g>

  <!-- Title -->
  <text x="48" y="560" fill="#f6f3eb" font-family="Arial" font-size="40" font-weight="800">Meeting-to-Action Copilot</text>
  <text x="48" y="584" fill="#a9aaa7" font-family="Arial" font-size="16">Spring Boot * REST APIs * Docker * SonarQube * React</text>
  <circle cx="912" cy="560" r="6" fill="#b8ff5c" filter="url(#glow)"/>
  <circle cx="912" cy="584" r="6" fill="#4fd1c5"/>
</svg>
